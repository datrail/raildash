# RailMon + RailDash, running together, from one command. DR-81 (BDL-F5).
# Two modes, sharing this base file; the only difference is image source:
#
#   make stack-local                          build from source checkouts, via
#                                             the docker-compose.build.yml
#                                             override
#   make stack RAILMON_TAG=... RAILDASH_TAG=...
#                                             pull the published ghcr.io images
#
# Both of RailDash's ingestion paths are wired at once: the file (RailMon
# writes JSONL to the shared `captures` volume, imported by the Makefile) and
# the webhook (posted straight to the raildash service by compose-network
# name). They do not double-count each other only because both sides are told
# the SAME session id (DEMO_SESSION_ID, set once in the Makefile) -- RailMon's
# JSONL carries no session id of its own, and RailDash dedups on
# (session_id, interaction_id), not interaction_id alone.
#
# The file import is NOT a service here, deliberately: a RailDash database is
# single-process by design (store.py takes PRAGMA locking_mode=EXCLUSIVE so an
# older process cannot write unredacted rows around a schema migration, DR-20),
# so a second opener gets "database is locked" wherever the file lives. The
# Makefile pauses the raildash service, runs `raildash load` as the sole
# owner, and starts it again. Full explanation in README.md's "Running both
# together" and Storage sections.

services:
  raildash:
    # Registry mode; docker-compose.build.yml overrides this with a local
    # build. Image tags carry no leading v (the release workflow publishes
    # 0.1.0 for git tag v0.1.0); `make stack` strips one either way.
    #
    # Required, not defaulted -- see the railmon service below for why there is
    # no `:-latest` here either.
    image: ghcr.io/datrail/raildash:${RAILDASH_TAG:?set RAILDASH_TAG to a published tag, or use `make stack RAILMON_TAG=... RAILDASH_TAG=...` / `make stack-local`}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - captures:/captures:ro
      - raildash-db:/data
    environment:
      RAILDASH_DB: /data/raildash.db
    healthcheck:
      # The image installs only RailDash's own Python deps -- no curl -- so
      # the check is a one-line stdlib request rather than a new package.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/webhook/health', timeout=2).status == 200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 15

  railmon:
    # No `:-latest` default, deliberately. This service is privileged with the
    # host PID namespace (below), so whatever image lands here runs
    # root-equivalent on the machine -- and `:latest` is a mutable pointer that
    # container-release.yml's own header documents as last-write-wins across
    # concurrent tag pushes. `make stack` already refuses to run without both
    # tags, but that guard lives in the Makefile: a bare `docker compose up` in
    # this directory would sail past it. Requiring the variable here means the
    # unguarded path fails with an explanation instead of silently pulling a
    # moving tag into a privileged container. Local-built mode supplies
    # `local`, which docker-compose.build.yml then replaces outright.
    image: ghcr.io/datrail/railmon:${RAILMON_TAG:?set RAILMON_TAG to a published tag, or use `make stack RAILMON_TAG=... RAILDASH_TAG=...` / `make stack-local`}
    # eBPF tap -- RailMon's collect/demo always need this; not a choice this
    # stack makes. See railmon's README "Platforms" for the host kernel
    # prerequisites (BTF/CO-RE) it does not relax.
    privileged: true
    pid: "host"
    command: ["demo"]
    volumes:
      - captures:/out
    environment:
      # Must match the --session-id the Makefile's import step passes, or the
      # two ingestion paths land in different sessions and every interaction
      # is counted twice. DEMO_SESSION_ID is set once in the Makefile and
      # exported; the default here only keeps a bare `docker compose up`
      # consistent with it.
      RAILMON_SESSION_ID: "${DEMO_SESSION_ID:-railmon-raildash-stack}"
      RAILMON_WEBHOOK_URL: "http://raildash:8000/webhook/http-interactions"
    depends_on:
      raildash:
        condition: service_healthy

volumes:
  captures:
  raildash-db:
