openapi: 3.1.0
info:
  title: RailDash API
  description: |
    Local dashboard API for DatRail captures and Agent Security Profiles.

    RailMon's collector captures and parses an agent's runtime traffic and
    posts it to the webhook routes. RailMon's scanner delivers evidence
    bundles to `/v1/evidence-bundles`, which RailDash keeps as Agent Security
    Profiles (ASPs) that can be locked as baselines and checked for drift.
    The dashboard's own UI (`/`, `/app.js`, `/app.css`) is not part of this
    contract.
  version: 0.2.0
  contact:
    name: DatRail

servers:
  - url: http://localhost:8000
    description: Local RailDash (`raildash serve`)

paths:
  /api/asps:
    get:
      operationId: listAsps
      summary: List redacted immutable ASP metadata
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
      responses:
        '200':
          description: Bounded ASP metadata page; evidence values and digests are omitted.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AspSummary'}

  /api/alignments:
    get:
      operationId: listAlignmentVersions
      summary: List redacted immutable alignment-version metadata
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
      responses:
        '200':
          description: Bounded alignment-version metadata page; digests are omitted.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AlignmentSummary'}

  /api/asps/history:
    get:
      operationId: listAspHistory
      summary: List received ASPs newest first, with baseline/locked/candidate status
      description: |
        Redacted metadata like `/api/asps`, plus each ASP's `status`
        (`baseline`, `locked` or `candidate`), its locked version labels,
        whether it is the newest for its agent, and its comparison with the
        active baseline when one was made.
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
      responses:
        '200':
          description: One page of ASP history
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Page'}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AspHistoryItem'}

  /api/asps/{asp_id}/state:
    get:
      operationId: getAspState
      summary: Get the redacted active-alignment state for one ASP
      parameters:
        - {$ref: '#/components/parameters/AspId'}
      responses:
        '200':
          description: Current alignment state and bounded redacted drift summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AspState'}
        '404': {description: ASP not found}

  /api/asps/{asp_id}/drift:
    get:
      operationId: getAspDrift
      summary: Get one bounded page of redacted drift changes
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
      responses:
        '200':
          description: Drift result whose changes contain names and field names, never evidence values.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DriftPage'}
        '404': {description: No active-alignment drift result for the ASP}

  /api/asps/{asp_id}/bundle:
    get:
      operationId: getAspBundle
      summary: Get the full parsed evidence bundle for one ASP
      description: |
        Token-gated (`X-RailDash-Token`): unlike the redacted routes above,
        this returns exact evidence values -- the same content
        `raildash asp export` writes to a private file.
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The parsed evidence-bundle envelope}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: ASP not found}

  /api/asps/{asp_id}/raw:
    get:
      operationId: downloadAspRaw
      summary: Download the ASP's evidence bundle exactly as it was received
      description: |
        Token-gated (`X-RailDash-Token`). The response body is byte-for-byte
        the bundle RailDash received, the same bytes `raildash asp export`
        writes, served as an attachment named `<asp_id>.json`.
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The exact received bytes (application/json)}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: ASP not found}

  /api/asps/{asp_id}/drift/explained:
    get:
      operationId: getAspDriftExplained
      summary: Get one bounded page of drift changes with old/new values and tier
      description: |
        Token-gated (`X-RailDash-Token`): the per-attribute detail behind the
        dashboard's "drift explained" view -- same full evidence
        `raildash asp drift-export` writes to a private file, paginated.
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/PageOffset'}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: Drift result whose changes carry baseline/current evidence values}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No drift result for the ASP}

  /api/asps/{asp_id}/lock:
    post:
      operationId: lockAsp
      summary: Lock one stored ASP as a new immutable alignment version
      description: Token-gated. Equivalent to `raildash asp lock <asp_id> --version <version>`.
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: {version: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '201': {description: The new alignment version}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such ASP}
        '409': {description: That version already exists for this agent identity, or this ASP is already locked}

  /api/asps/{asp_id}/baseline:
    post:
      operationId: makeBaseline
      summary: Make one stored ASP the active baseline, locking it first if needed
      description: |
        Token-gated. Idempotent: an ASP is locked at most once, and an ASP
        that is already the active baseline is left as it is. `version` is
        needed only when the ASP is not locked yet. Equivalent to
        `raildash asp baseline <asp_id> [--version <version>]`.
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {version: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '201':
          description: This call locked the ASP; the new alignment version and its active binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaselineResult'}
        '200':
          description: The ASP was already locked; its alignment version and the active binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaselineResult'}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such ASP}
        '409': {description: A version label is needed, or that label already exists for this agent identity}

  /api/alignments/{alignment_version_id}/switch:
    post:
      operationId: switchAlignment
      summary: Make one alignment version active for its agent identity
      description: Token-gated. Equivalent to `raildash asp switch <alignment_version_id>`.
      parameters:
        - name: alignment_version_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The new active binding}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such alignment version}

  /api/asps/{asp_id}/accept-drift:
    post:
      operationId: acceptDrift
      summary: Accept the current drifted ASP as the new baseline
      description: |
        Token-gated. The same idempotent action as
        `POST /api/asps/{asp_id}/baseline`: accepting an ASP that is already
        locked reuses its alignment version instead of locking it again.
      parameters:
        - {$ref: '#/components/parameters/AspId'}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {version: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '201':
          description: This call locked the ASP; the new alignment version and its active binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaselineResult'}
        '200':
          description: The ASP was already locked; its alignment version and the active binding
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaselineResult'}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such ASP}
        '409': {description: A version label is needed, or that label already exists for this agent identity}

  /api/guardrails:
    get:
      operationId: listGuardrails
      summary: Every agent with a baseline or a guardrail, and its Data Guardrail state
      description: |
        Token-gated (DR-184), like every guardrail route: states (`held`,
        `violated`, `unverified`, `no_guardrail`), each rule's state and
        reason, the active version's label and the number of counting rows.
        No hosts, paths or ports.
      parameters:
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: One entry per agent, with its opaque `agent_ref`}
        '403': {description: Missing or invalid X-RailDash-Token}

  /api/guardrails/{agent_ref}:
    get:
      operationId: getGuardrail
      summary: One agent's guardrail with its rows, offers, versions and history
      description: |
        Token-gated (DR-184): the rows name hosts, paths and ports. Carries the
        §4.4 proposal while the agent has a baseline and no guardrail.
      parameters:
        - {name: agent_ref, in: path, required: true, schema: {type: string, pattern: '^agt-[0-9a-f]{24}$'}}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The agent's guardrail}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such agent}

  /api/alignments/{alignment_version_id}/guardrail:
    post:
      operationId: adoptGuardrail
      summary: Adopt the proposal from this baseline, or the proposal as edited
      description: Token-gated (DR-184).
      parameters:
        - {name: alignment_version_id, in: path, required: true, schema: {type: string, minLength: 1}}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules: {type: object, description: "A whole version's `rules` (raildash/schemas/guardrail-version-v1.schema.json)"}
      responses:
        '201': {description: The first version, now active}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '409': {description: The agent's current state refuses this action}
        '422': {description: The rules break the guardrail contract}

  /api/guardrail-versions/{guardrail_version_id}/edit:
    post:
      operationId: editGuardrail
      summary: A new version from the active one
      description: Token-gated (DR-184).
      parameters:
        - {name: guardrail_version_id, in: path, required: true, schema: {type: string, minLength: 1}}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: {type: object, description: "A whole version's `rules` (raildash/schemas/guardrail-version-v1.schema.json)"}
      responses:
        '201': {description: The new version, now active}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '409': {description: The agent's current state refuses this action}
        '422': {description: The rules break the guardrail contract}

  /api/guardrail-versions/{guardrail_version_id}/switch:
    post:
      operationId: switchGuardrail
      summary: Make an existing version the active one
      description: Token-gated (DR-184).
      parameters:
        - {name: guardrail_version_id, in: path, required: true, schema: {type: string, minLength: 1}}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The version now active}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}

  /api/guardrails/{agent_ref}/turn-off:
    post:
      operationId: turnOffGuardrail
      summary: Clear the active pointer (No guardrail); versions and rows stay
      description: Token-gated (DR-184).
      parameters:
        - {name: agent_ref, in: path, required: true, schema: {type: string, pattern: '^agt-[0-9a-f]{24}$'}}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The agent has no guardrail}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '409': {description: The agent's current state refuses this action}

  /api/guardrail-rows/{row_id}/acknowledge:
    post:
      operationId: acknowledgeGuardrailRow
      summary: Mark one row seen up to now; a later hit re-opens it
      description: Token-gated (DR-184).
      parameters:
        - {name: row_id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 9223372036854775807}}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200': {description: The row}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '422': {description: row_id outside 1..2^63-1}

  /api/guardrail-rows/{row_id}/allow:
    post:
      operationId: allowGuardrailRow
      summary: Allow this - a new version with the row's item allowed
      description: Token-gated (DR-184).
      parameters:
        - {name: row_id, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 9223372036854775807}}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '201': {description: The new version, now active}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '409': {description: The row can't be allowed with one click (overflow, unknown or wildcard host, over a size cap) or no guardrail is active}
        '422': {description: row_id outside 1..2^63-1, or the version this would create breaks the guardrail contract (e.g. an over-long host or path)}

  /api/guardrails/{agent_ref}/offers/allow:
    post:
      operationId: allowDeclaredOffer
      summary: Allow a host or MCP server declared since the version in force
      description: Token-gated (DR-184).
      parameters:
        - {name: agent_ref, in: path, required: true, schema: {type: string, pattern: '^agt-[0-9a-f]{24}$'}}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: {type: string, enum: [host, mcp_server]}
                value: {type: string}
      responses:
        '201': {description: The new version, now active}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '409': {description: Not a current declared offer}
        '422': {description: The version this would create breaks the guardrail contract (e.g. an over-long host or path)}

  /api/guardrails/{agent_ref}/offers/dismiss:
    post:
      operationId: dismissDeclaredOffer
      summary: Dismiss a declared offer; it isn't offered again
      description: Token-gated (DR-184).
      parameters:
        - {name: agent_ref, in: path, required: true, schema: {type: string, pattern: '^agt-[0-9a-f]{24}$'}}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: {type: string, enum: [host, mcp_server]}
                value: {type: string}
      responses:
        '201': {description: The new version, now active}
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: No such id}
        '409': {description: Not a current declared offer}
        '422': {description: The version this would create breaks the guardrail contract (e.g. an over-long host or path)}

  /api/settings/asp-retention:
    get:
      operationId: getAspRetention
      summary: Get the current ASP retention bounds
      responses:
        '200': {description: Current keep_count and max_age_days}
    post:
      operationId: setAspRetention
      summary: Persist a new ASP retention bound
      description: |
        Token-gated. Equivalent to `raildash asp retention-set`. Stored in the
        database, so it survives a restart without an env var.
      parameters:
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep_count, max_age_days]
              properties:
                keep_count: {type: integer, minimum: 1}
                max_age_days: {type: integer, minimum: 1}
      responses:
        '200': {description: The saved retention bounds}
        '403': {description: Missing or invalid X-RailDash-Token}
        '422': {description: keep_count/max_age_days must be positive integers}

  /api/asps/prune:
    post:
      operationId: pruneAsps
      summary: Prune unlocked ASP history now
      description: Token-gated. Equivalent to `raildash asp prune`.
      parameters:
        - {$ref: '#/components/parameters/RailDashToken'}
        - name: keep_count
          in: query
          schema: {type: integer, minimum: 1}
        - name: max_age_days
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Count of pruned ASPs}
        '403': {description: Missing or invalid X-RailDash-Token}

  /v1/evidence-bundles:
    post:
      operationId: ingestEvidenceBundle
      summary: Ingest one Agent Security Profile evidence bundle
      description: |
        Token-gated. RailDash's counterpart to Rail Center's own
        `POST /v1/evidence-bundles` -- same path and general shape, RailDash's
        own dedup semantics (content digest, not a client-asserted id). The
        body is the exact evidence-bundle bytes, unmodified, bounded by
        `RAILDASH_MAX_EVIDENCE_BUNDLE_BYTES` (default 1,048,576).
      parameters:
        - name: agent_key
          in: query
          schema: {type: string, maxLength: 128}
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: string, format: binary}
      responses:
        '202': {description: 'Accepted: {accepted, asp_id, duplicate}'}
        '403': {description: Missing or invalid X-RailDash-Token}
        '409': {description: This id/identity already names different stored bytes}
        '422': {description: Malformed or unresolvable evidence bundle}

  /api/sessions:
    get:
      operationId: listSessions
      summary: List capture sessions, most recently active first
      responses:
        '200':
          description: |
            Array of sessions: session_id, agent, capture_start, first_seen,
            last_seen, source, interaction_count, error_count, event_count.

  /api/overview:
    get:
      operationId: getOverview
      summary: Summary counts for the dashboard, for one session or all
      parameters:
        - {name: session_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: |
            {totals, hosts[], models[], statuses[]}: interaction, host, error
            and tool-call counts, latency and byte totals, and per-host,
            per-model and per-status breakdowns.

  /api/filters:
    get:
      operationId: listFilterValues
      summary: Distinct values the interaction filters can take
      parameters:
        - {name: session_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: '{hosts[], methods[], agent_keys[]}'

  /api/profile:
    get:
      operationId: downloadObservedProfile
      summary: Download an observed-only Agent Security Profile draft
      description: |
        Summarises facts observed in one RailMon capture. The versioned JSON
        has source=raildash-observed, contains no credential values, and is not
        an authoritative Rail Center score. With agent_key, only interactions
        attributed to that agent count; ambiguous, unknown and conflict rows
        never count toward any agent.
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
        - name: agent_key
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Portable observed profile JSON
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservedProfile'
        '404':
          description: Session not found

  /api/profile/kernel-file-access:
    get:
      operationId: getKernelFileAccess
      summary: The files the kernel saw a capture's sandbox open
      description: |
        Token-gated (`X-RailDash-Token`). RailMon's kernel-observed
        `observed_file_access` attribute from the latest ASP received for each
        sandbox this capture's interactions name (`matched_by: sandbox`); for a
        capture that names none, from the latest ASP of every sandbox
        (`matched_by: latest`). At most 8 sources. Kept apart from the files
        the capture's tool calls asked for (`/api/profile`). `evidence` is
        null for an ASP whose rule pack predates the attribute, or whose
        stored bundle no longer validates (then `error` says so).
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string}
        - name: agent_key
          in: query
          schema: {type: string}
        - {$ref: '#/components/parameters/RailDashToken'}
      responses:
        '200':
          description: Kernel-observed file access per sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KernelFileAccess'
        '403': {description: Missing or invalid X-RailDash-Token}
        '404': {description: Session not found}

  /api/interactions:
    get:
      operationId: listInteractions
      summary: List captured interactions, newest first
      description: |
        Filters combine with AND. agent_key selects rows attributed to one
        agent; unattributed=true selects the unattributed queue (ambiguous,
        unknown and conflict rows, each with attribution_reason and the
        capturing attribution_target), which the default list still includes.
      parameters:
        - {name: session_id, in: query, schema: {type: string}}
        - {name: host, in: query, schema: {type: string}}
        - {name: method, in: query, schema: {type: string}}
        - {name: status_class, in: query, schema: {type: string, pattern: '^[1-5]$'}}
        - {name: q, in: query, schema: {type: string}}
        - {name: errors_only, in: query, schema: {type: boolean}}
        - {name: agent_key, in: query, schema: {type: string}}
        - name: attribution_state
          in: query
          schema: {type: string, enum: [attributed, ambiguous, unknown, conflict]}
        - {name: unattributed, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: |
            {total, items[]}. Each item carries the redacted summary columns
            (method, host, path, status_code, latency_ms, sizes, model,
            tool_calls, has_ticket) plus agent_host_id, sandbox_name,
            agent_key, attribution_state, attribution_method,
            attribution_reason and attribution_target; never the raw body.

  /api/interactions/{row_id}:
    get:
      operationId: investigateInteraction
      summary: Inspect an interaction in its captured sequence
      description: |
        Returns the credential-redacted exchange, nearby interactions from the
        same session and pid/tid in timestamp order, captured tool_use names,
        and previous/next error and tool-call row identifiers.
      parameters:
        - name: row_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Interaction investigation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionInvestigation'
        '404':
          description: Interaction not found

  /webhook/events:
    post:
      operationId: receiveEvents
      summary: Receive a batch of captured SSL events
      description: |
        Receives a batch of raw SSL events captured by eBPF sslsniff.
        Each event contains the raw decrypted SSL data (which may be HTTP request/response).
        Open to any caller; an optional `X-RailDash-Token` marks the batch
        as authenticated (see `RailDashCaptureToken`).
      parameters:
        - {$ref: '#/components/parameters/RailDashCaptureToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Events received successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchResponse'
        '400':
          description: Invalid request body
        '500':
          description: Server error

  /webhook/http-interactions:
    post:
      operationId: receiveHttpInteractions
      summary: Receive parsed HTTP request/response pairs
      description: |
        Receives HTTP interactions that have been parsed from raw SSL events.
        The Python collector correlates WRITE/SEND (request) and READ/RECV (response)
        events by PID/TID and parses them into structured HTTP objects.
        Open to any caller; an optional `X-RailDash-Token` marks the batch
        as authenticated (see `RailDashCaptureToken`). An authenticated
        delivery of an interaction already stored unauthenticated under the
        same `(session_id, interaction_id)` replaces that row and counts in
        `stored`; an unauthenticated copy never replaces an authenticated one.
      parameters:
        - {$ref: '#/components/parameters/RailDashCaptureToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpInteractionBatch'
      responses:
        '200':
          description: Interactions received successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpInteractionBatchResponse'
        '400':
          description: Invalid request body
        '500':
          description: Server error

  /webhook/heartbeat:
    post:
      operationId: receiveCollectorHeartbeat
      summary: Record that a collector is alive with at least one tap attached
      description: |
        Token-gated (DR-184, Data Guardrail M0). `railmon collect` posts this
        every 60 s while at least one tap is attached, so RailDash can tell
        an idle agent from a dead collector. Stored per `collector_id`
        (upserted) with RailDash's own receive time as the liveness time;
        `sent_at` is kept as received and never decides liveness. The body is
        closed: an unknown or missing field is a 422. Bounded at 4,096 bytes.
      parameters:
        - {$ref: '#/components/parameters/RailDashToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorHeartbeat'
      responses:
        '200':
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
        '400': {description: Invalid JSON body}
        '403': {description: Missing or invalid X-RailDash-Token}
        '413': {description: Body larger than 4,096 bytes}
        '415': {description: Content-Type is not application/json}
        '422': {description: 'Not an object, an unknown or missing field, or a field out of range'}

  /webhook/sessions:
    get:
      operationId: listWebhookSessions
      summary: List capture sessions (compatibility route)
      description: Kept for clients of the earlier webhook server; prefer /api/sessions.
      responses:
        '200':
          description: |
            Array of {session_id, agent, capture_start, event_count,
            interaction_count}.

  /webhook/sessions/{session_id}:
    get:
      operationId: getWebhookSession
      summary: One capture session with up to 500 of its interactions (compatibility route)
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The session's fields plus http_interactions[].
        '404':
          description: Session not found

  /webhook/health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  parameters:
    AspId:
      name: asp_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    PageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    PageOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    RailDashToken:
      name: X-RailDash-Token
      in: header
      required: true
      description: |
        The local write token: `RAILDASH_TOKEN` if set, otherwise the contents
        of `<db path>.token` (0600), which RailDash creates on first start and
        reuses across restarts. Required on every write route, on every
        guardrail route, and on the four reads that carry exact evidence
        (`bundle`, `raw`, `drift/explained`, `profile/kernel-file-access`).
      schema: {type: string}
    RailDashCaptureToken:
      name: X-RailDash-Token
      in: header
      required: false
      description: |
        Optional on the capture webhooks. The same local write token as
        `RailDashToken`; with it the batch is stored as authenticated, which
        is what the Data Guardrail's request rules judge. Without it, or with
        a wrong one, the batch is still accepted and stored as before, marked
        unauthenticated -- the webhook stays open for collectors that predate
        the token. The mark is not returned by any unauthenticated read route.
      schema: {type: string}

  schemas:
    KernelFileAccess:
      type: object
      required: [session_id, agent_key, attribute, matched_by, sources, sources_truncated]
      properties:
        session_id: {type: string}
        agent_key: {type: [string, 'null']}
        attribute: {const: observed_file_access}
        matched_by: {enum: [sandbox, latest]}
        sources_truncated: {type: boolean}
        sources:
          type: array
          maxItems: 8
          items:
            type: object
            required: [asp_id, collected_at, stored_at, subject, contract, evidence, error]
            properties:
              asp_id: {type: string}
              error:
                type: ['string', 'null']
                description: Set when the stored bundle no longer passes this RailDash's validation; evidence is then null.
              collected_at: {type: string, format: date-time}
              stored_at: {type: string, format: date-time}
              subject:
                type: object
                properties:
                  host_id: {type: string}
                  sandbox_name: {type: string}
              contract:
                type: object
                properties:
                  bundle_version: {type: integer}
                  rule_pack_version: {type: integer}
              evidence:
                description: The attribute's qualifiers and its list; null if the ASP has no such attribute.
                type: ['object', 'null']
                required: [status, reason, tier, authored_by, note, files]
                properties:
                  status: {enum: [ANSWERED, ABSENT, TEMPLATED, PARTIAL, BLIND, FAILED]}
                  reason: {type: [string, 'null']}
                  tier: {type: string, description: "observed for RailMon's filesnoop"}
                  authored_by: {type: [string, 'null']}
                  note: {type: [string, 'null']}
                  files:
                    type: array
                    description: Evidence-bundle v1 `$defs.file_access_value`; empty when the status carries no list.
                    items:
                      type: object
                      required: [path, read, write, exec, layer]
                      properties:
                        path: {type: string}
                        read: {type: boolean}
                        write: {type: boolean}
                        exec: {type: boolean}
                        layer: {type: boolean}

    BaselineResult:
      type: object
      required: [alignment_version, binding, locked, switched]
      properties:
        alignment_version: {type: object, description: The ASP's alignment version}
        binding: {type: object, description: The agent identity's active binding}
        locked: {type: boolean, description: Whether this call locked the ASP}
        switched: {type: boolean, description: Whether this call changed the active baseline}

    AspHistoryItem:
      description: An AspSummary without its digest, plus where the ASP stands now.
      allOf:
        - {$ref: '#/components/schemas/AspSummary'}
        - type: object
          required: [status, latest_for_agent, locked_versions, comparison]
          properties:
            status: {type: string, enum: [baseline, locked, candidate]}
            latest_for_agent: {type: boolean}
            locked_versions:
              type: array
              items:
                type: object
                required: [alignment_version_id, version, locked_at, active]
                properties:
                  alignment_version_id: {type: string}
                  version: {type: string}
                  locked_at: {type: string, format: date-time}
                  active: {type: boolean}
            comparison:
              nullable: true
              type: object
              required: [against_version, state, change_count]
              properties:
                against_version: {type: string}
                state: {type: string, enum: [ALIGNED, DRIFT_DETECTED, COMPARISON_UNAVAILABLE]}
                change_count: {type: integer, minimum: 0}

    Page:
      type: object
      required: [total, items, limit, offset]
      properties:
        total: {type: integer, minimum: 0}
        items: {type: array}
        limit: {type: integer, minimum: 1, maximum: 500}
        offset: {type: integer, minimum: 0}

    AgentIdentity:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [deployment_environment, deployment_compose, local_agent_key, local_agent_keys]
        value:
          description: Closed identity value for the named kind; never evidence content.
          oneOf:
            - {type: string, maxLength: 128}
            - {type: object}
            - {type: array, items: {type: string, maxLength: 128}}

    AspSummary:
      type: object
      required: [asp_id, bundle_id, collected_at, stored_at, subject, contract, agent_identity, replayed]
      properties:
        asp_id: {type: string}
        bundle_id: {type: string}
        collected_at: {type: string, format: date-time}
        stored_at: {type: string, format: date-time}
        subject:
          type: object
          required: [host_id, sandbox_name]
          properties:
            host_id: {type: string}
            sandbox_name: {type: string}
        contract:
          type: object
          required: [bundle_version, rule_pack_version]
          properties:
            bundle_version: {type: integer, enum: [1, 2]}
            rule_pack_version: {type: integer, minimum: 1}
        agent_identity: {$ref: '#/components/schemas/AgentIdentity'}
        replayed: {type: boolean}

    AlignmentSummary:
      type: object
      required: [alignment_contract_version, alignment_version_id, version, locked_at, agent_identity, contract, asp, active]
      properties:
        alignment_contract_version: {type: integer, const: 1}
        alignment_version_id: {type: string}
        version: {type: string}
        locked_at: {type: string, format: date-time}
        agent_identity: {$ref: '#/components/schemas/AgentIdentity'}
        contract: {type: object}
        asp:
          type: object
          required: [asp_id]
          properties:
            asp_id: {type: string}
        active: {type: boolean}

    DriftChange:
      type: object
      description: >-
        Contract v1 (evidence bundle v1) changes carry no `agent_key`. Contract
        v2 (evidence bundle v2) changes always carry it: null for the
        shared sandbox scope and for attestations, otherwise the agent the
        change is in. AGENT_* changes are v2 only; their `name` is the agent_key.
        A v2 attribute declaring a `window` reports `value` only
        for something newly seen in the window (a new item, or a `union`
        key turned true), never for what a quieter window did not see.
      required: [type, name, fields]
      properties:
        agent_key: {type: [string, 'null']}
        type:
          type: string
          enum: [ATTRIBUTE_ADDED, ATTRIBUTE_REMOVED, ATTRIBUTE_CHANGED, SOURCE_ADDED, SOURCE_REMOVED, SOURCE_CHANGED, ATTESTATION_ADDED, ATTESTATION_REMOVED, ATTESTATION_CHANGED, AGENT_ADDED, AGENT_REMOVED, AGENT_CHANGED]
        name: {type: string}
        fields:
          type: array
          items: {type: string}

    DriftResult:
      type: object
      required: [drift_contract_version, comparable, has_drift, reason, change_count, changes, truncated]
      properties:
        drift_contract_version: {type: integer, enum: [1, 2]}
        comparable: {type: boolean}
        has_drift: {type: [boolean, 'null']}
        reason:
          type: [string, 'null']
          enum: [IDENTITY_MISMATCH, CONTRACT_MISMATCH, INVALID_BUNDLE, ALIGNMENT_INTEGRITY_FAILED, NO_ACTIVE_ALIGNMENT, null]
        change_count: {type: integer, minimum: 0}
        changes:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/DriftChange'}
        truncated: {type: boolean}

    DriftPage:
      allOf:
        - {$ref: '#/components/schemas/DriftResult'}
        - type: object
          required: [available_change_count, limit, offset]
          properties:
            available_change_count: {type: integer, minimum: 0, maximum: 500}
            limit: {type: integer, minimum: 1, maximum: 500}
            offset: {type: integer, minimum: 0}

    AspState:
      type: object
      required: [asp, state, active_alignment, drift]
      properties:
        asp: {$ref: '#/components/schemas/AspSummary'}
        state:
          type: string
          enum: [NO_ACTIVE_ALIGNMENT, ALIGNMENT_ACTIVE, ALIGNED, DRIFT_DETECTED, COMPARISON_UNAVAILABLE]
        active_alignment: {type: [object, 'null']}
        drift:
          oneOf:
            - {$ref: '#/components/schemas/DriftResult'}
            - {type: 'null'}

    ObservedValueCount:
      type: object
      required: [value, count]
      properties:
        value: {type: string}
        count: {type: integer}

    ObservedFileCount:
      allOf:
        - {$ref: '#/components/schemas/ObservedValueCount'}
        - type: object
          required: [read, write]
          properties:
            read: {type: integer, description: Times a tool call asked to read it.}
            write: {type: integer, description: Times a tool call asked to create, change or move it.}
      description: count is read + write.

    ObservedProfile:
      type: object
      required: [schema_version, source, authoritative, disclaimer, session, observed]
      properties:
        schema_version: {type: string, const: '1.0'}
        source: {type: string, const: raildash-observed}
        authoritative: {type: boolean, const: false}
        disclaimer: {type: string}
        session:
          type: object
          required: [id, agent, capture_start]
          properties:
            id: {type: string}
            agent: {type: string}
            capture_start: {type: string}
            agent_key: {type: string}
        observed:
          type: object
          required: [interaction_count, error_count, error_rate, x_rail, hosts, methods, models, tool_names, tool_names_truncated, request_media_types, content_kinds, upload_bytes, file_access, file_types, truncated_dimensions]
          properties:
            interaction_count: {type: integer}
            error_count: {type: integer}
            error_rate: {type: number, minimum: 0, maximum: 1}
            x_rail:
              type: object
              required: [present, interaction_count]
              properties:
                present: {type: boolean}
                interaction_count: {type: integer}
            hosts:
              type: array
              items: {$ref: '#/components/schemas/ObservedValueCount'}
            methods:
              type: array
              items: {$ref: '#/components/schemas/ObservedValueCount'}
            models:
              type: array
              items: {$ref: '#/components/schemas/ObservedValueCount'}
            tool_names:
              type: array
              items: {$ref: '#/components/schemas/ObservedValueCount'}
            tool_names_truncated:
              type: boolean
              description: True when safety limits prevented a complete tool-name summary.
            request_media_types:
              type: array
              items: {$ref: '#/components/schemas/ObservedValueCount'}
              description: Request Content-Type media types, parameters dropped; count is interactions.
            content_kinds:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/ObservedValueCount'}
                  - properties:
                      value: {type: string, enum: [image, document, audio]}
              description: Media kinds carried in request bodies (e.g. image upload blocks); count is interactions carrying that kind. Never the media itself.
            upload_bytes:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/ObservedValueCount'}
                  - type: object
                    required: [total_bytes, max_bytes]
                    properties:
                      total_bytes: {type: integer, description: Sum of request sizes sent to this host.}
                      max_bytes: {type: integer, description: Largest single request sent to this host.}
              description: Bytes sent per destination host, largest total first; value is the host, count is interactions with a positive recorded request size. A request size is the whole captured HTTP request, headers included.
            file_access:
              type: array
              items: {$ref: '#/components/schemas/ObservedFileCount'}
              description: >-
                Files the model asked a known file tool (Claude Code's Read/Write/Edit family, Anthropic's text editor
                tool, the MCP filesystem server) to read or write; value is the path as the model
                wrote it, trimmed and cut to 256 characters. MCP tools match by tool name under any server name. Paths
                written to come first, then most calls; reading many files never displaces a written one. Each tool_use id counts once per capture however many later
                requests replay it; a block without an id counts every time it is seen. This is the captured
                conversation, not a filesystem trace: it does not show that the tool ran or succeeded.
            file_types:
              type: array
              items: {$ref: '#/components/schemas/ObservedFileCount'}
              description: The same calls grouped by lower-cased file extension, types written to first, then most calls; `(none)` for a path without one, `(other)` for an extension of 16 or more characters.
            truncated_dimensions:
              type: array
              items: {type: string, enum: [hosts, methods, models, tool_names, request_media_types, upload_bytes, file_access, file_writes, file_types]}
              description: >-
                Dimensions whose cardinality or value-length safety limit was reached. file_writes means the paths in
                file_access with a write may be incomplete; file_access alone means only read-only paths were cut.

    InteractionSummary:
      type: object
      required: [id, session_id, tool_calls, has_ticket, tool_names]
      properties:
        id: {type: integer}
        session_id: {type: string}
        interaction_id: {type: [string, 'null']}
        timestamp: {type: [string, 'null']}
        timestamp_ns: {type: [integer, 'null']}
        pid: {type: [integer, 'null']}
        tid: {type: [integer, 'null']}
        method: {type: [string, 'null']}
        host: {type: [string, 'null']}
        path: {type: [string, 'null']}
        status_code: {type: [integer, 'null']}
        latency_ms: {type: [number, 'null']}
        tool_calls: {type: integer}
        has_ticket:
          type: integer
          description: Ticket presence as 0 or 1; the credential value is never returned.
        tool_names:
          type: array
          items: {type: string}
          description: Untrusted text derived from captured tool_use blocks.

    InteractionNavigation:
      type: object
      required: [previous_error, next_error, previous_tool_call, next_tool_call]
      properties:
        previous_error: {type: [integer, 'null']}
        next_error: {type: [integer, 'null']}
        previous_tool_call: {type: [integer, 'null']}
        next_tool_call: {type: [integer, 'null']}

    InteractionInvestigation:
      allOf:
        - $ref: '#/components/schemas/InteractionSummary'
        - type: object
          required: [raw, nearby, navigation]
          properties:
            raw:
              type: object
              description: Captured interaction with credential headers redacted.
            nearby:
              type: array
              description: Same-session pid/tid interactions ordered by timestamp.
              items:
                $ref: '#/components/schemas/InteractionSummary'
            navigation:
              $ref: '#/components/schemas/InteractionNavigation'

    # ---- Raw SSL Event (directly from sslsniff) ----
    SslEvent:
      type: object
      required:
        - function
        - timestamp_ns
        - pid
        - tid
        - uid
        - comm
        - len
        - buf_size
        - is_handshake
        - truncated
      properties:
        function:
          type: string
          enum: ["WRITE/SEND", "READ/RECV", "HANDSHAKE"]
          description: SSL operation type
        timestamp_ns:
          type: integer
          format: uint64
          description: Nanoseconds since system boot (bpf_ktime_get_ns)
        comm:
          type: string
          maxLength: 16
          description: Thread name (not process name). Claude Code shows "HTTP Client".
        pid:
          type: integer
          format: uint32
          description: Process ID
        tid:
          type: integer
          format: uint32
          description: Thread ID
        uid:
          type: integer
          format: uint32
          description: User ID
        len:
          type: integer
          format: uint32
          description: Total bytes returned by the SSL function
        buf_size:
          type: integer
          format: uint32
          description: Actual bytes captured (capped at 512KB)
        latency_ms:
          type: number
          format: float
          description: SSL function call latency in milliseconds
        is_handshake:
          type: boolean
          description: Whether this is a handshake event
        data:
          type: string
          nullable: true
          description: Decrypted plaintext payload (JSON-escaped). Null if no data captured.
        truncated:
          type: boolean
          description: True if data exceeded 512KB capture buffer
        bytes_lost:
          type: integer
          description: Bytes not captured (only present when truncated)

    EventBatch:
      type: object
      required:
        - session_id
        - events
      properties:
        session_id:
          type: string
          format: uuid
          description: Unique capture session ID
        agent:
          type: string
          description: Agent being monitored (e.g. "claude-code")
          example: claude-code
        capture_start:
          type: string
          format: date-time
          description: Session start timestamp (wall clock)
        events:
          type: array
          items:
            $ref: '#/components/schemas/SslEvent'

    CollectorHeartbeat:
      type: object
      additionalProperties: false
      required: [collector_id, taps_attached, sent_at]
      properties:
        collector_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x7E]+$'
          description: Stable id of one collector; printable ASCII.
        taps_attached:
          type: integer
          minimum: 1
          description: Taps attached right now. A boolean is refused.
        sent_at:
          type: string
          format: date-time
          description: |
            The collector's own clock, RFC 3339 with a time zone. Stored as
            received; RailDash's receive time is what counts for liveness.

    EventBatchResponse:
      type: object
      properties:
        received:
          type: integer
          description: Number of events accepted
        session_id:
          type: string

    # ---- Parsed HTTP Interaction ----
    HttpRequest:
      type: object
      required:
        - method
        - path
      properties:
        method:
          type: string
          enum: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS", "HEAD"]
        path:
          type: string
          description: Request path (e.g. "/v1/messages?beta=true")
        headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers (auth headers redacted)
        body:
          description: Parsed request body (JSON object if Content-Type is application/json, string otherwise)
        body_raw:
          type: string
          description: Raw body string (only if body parsing failed)

    HttpResponse:
      type: object
      required:
        - status_code
      properties:
        status_code:
          type: integer
          description: HTTP status code
        status_text:
          type: string
          description: HTTP status text (e.g. "OK")
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          description: Parsed response body. For SSE streams, this is the merged content.
        body_raw:
          type: string
          description: Raw body string (only if body parsing failed)
        is_sse:
          type: boolean
          description: Whether the response was an SSE stream

    HttpInteraction:
      type: object
      required:
        - timestamp
        - pid
      properties:
        timestamp:
          type: string
          format: date-time
          description: Wall-clock time of the interaction
        timestamp_ns:
          type: integer
          format: uint64
          description: Original eBPF timestamp (nanoseconds since boot)
        pid:
          type: integer
          format: uint32
        tid:
          type: integer
          format: uint32
        uid:
          type: integer
          format: uint32
        comm:
          type: string
        request:
          $ref: '#/components/schemas/HttpRequest'
        response:
          $ref: '#/components/schemas/HttpResponse'
        latency_ms:
          type: number
          description: Total request-to-response latency
        request_size:
          type: integer
          description: Request body size in bytes
        response_size:
          type: integer
          description: Response body size in bytes
        truncated:
          type: boolean
          description: Whether any part of the interaction was truncated

    HttpInteractionBatch:
      type: object
      required:
        - session_id
        - interactions
      properties:
        session_id:
          type: string
          format: uuid
        agent:
          type: string
          example: claude-code
        capture_start:
          type: string
          format: date-time
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/HttpInteraction'

    HttpInteractionBatchResponse:
      type: object
      properties:
        received:
          type: integer
        session_id:
          type: string

    # ---- Standard Logistics Data Format (from rail-model-data) ----
    TrackingLife:
      type: object
      properties:
        time:
          type: string
          format: date-time
          example: "2026-01-19 14:00:00"
        context:
          type: string
          example: "Courier is out for delivery in the local area."
        location:
          type: string
          example: "Singapore Central"

    TrackingData:
      type: object
      description: Standard logistics data format (from rail-model-data)
      properties:
        carrier:
          type: string
          example: "SF Express"
        tracking_num:
          type: string
          example: "SF1423300958742"
        status:
          type: string
          example: "Delivering"
        is_exception:
          type: boolean
