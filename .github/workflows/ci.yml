# Test and build on every change, so a break surfaces on the pull request
# rather than after a release tag exists.
#
# RailDash was the one component repository with no CI at all, which is why a
# 41-test suite could sit in a pull request with nothing running it.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit-ish to check out. A called workflow's `github.ref` is the
          caller's, so a release path must pass the resolved tag explicitly.
          Empty means "whatever triggered this run".
        type: string
        required: false
        default: ""

permissions:
  contents: read

# A PR groups by ref, so a new push supersedes the last; everything else groups
# by SHA, so each commit keeps its own signal and cannot be evicted from the
# queue by a newer one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Named, not ubuntu-latest: that label moves to 26.04 from 2026-10-19 to
    # 11-19, run by run (actions/runner-images#14748). Move on purpose (DR-133).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # RailMon produces the evidence bundles RailDash validates against its
      # vendored copy of RailMon's schemas. The drift test compares the two
      # byte for byte and fails (rather than skips) under CI when RailMon's
      # copy is missing. Its default branch, not a pin: a RailMon schema change
      # RailDash has not re-vendored is exactly the break to surface here.
      # Sparse, so pytest never sees RailMon's own tests.
      - uses: actions/checkout@v7
        with:
          repository: datrail/railmon
          path: .ci/railmon
          sparse-checkout: schemas
          persist-credentials: false

      # `make test` builds its own virtualenv and installs requirements-dev,
      # so this needs no separate pip step and the local and CI runs are the
      # same command. RailDash does have dependencies — FastAPI and uvicorn —
      # unlike the stdlib-only scanner.
      - run: make test
        env:
          RAILMON_SCHEMAS_DIR: ${{ github.workspace }}/.ci/railmon/schemas

      # Exercise the real local server and ASP database in Chromium. Keeping
      # this in the existing test job makes a UI regression a required PR
      # signal without adding browser weight to the runtime image.
      - run: .venv/bin/playwright install --with-deps chromium
      - run: make browser-test

      # The front end has no build step, so nothing else would catch a CSS
      # token that was renamed, an id the script reaches for that no longer
      # exists, or a code path that assigns markup. All three fail silently in
      # a browser; this fails the build instead.
      - run: make lint

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      # Build only — nothing is pushed from a pull request. Single-arch amd64:
      # this exists to catch a Dockerfile that does not build, or an image that
      # builds but fails the smoke test below, and the arm64 leg costs QEMU
      # emulation for a signal amd64 already gives. RailDash is pure Python, so
      # there is no arch-specific path to miss.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Loaded so the next step runs the very image a release would publish.
          load: true
          tags: raildash:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # Start the image as shipped (its own CMD, user and /data volume) and
      # drive it from the runner with real RailMon rows and an evidence bundle
      # (DR-109 M4). The token is the one the container wrote next to its
      # database, which is how a co-located client gets it.
      - name: Smoke test the built image
        run: |
          docker run -d --name raildash -p 127.0.0.1:8000:8000 raildash:ci
          for _ in $(seq 60); do
            # Non-empty, not just readable: the file is created, then written.
            token=$(docker exec raildash cat /data/raildash.db.token 2>/dev/null || true)
            [ -n "$token" ] && break
            sleep 0.5
          done
          python3 tests/image_smoke.py http://127.0.0.1:8000 "$token" \
            || { docker logs raildash; exit 1; }
