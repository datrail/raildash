# Local-built mode override: build both images from source instead of pulling.
#
#   RAILMON_TAG=local RAILDASH_TAG=local \
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# The tags are placeholders and go unused -- the image names below replace the
# base file's outright -- but the base file requires them rather than
# defaulting to `:latest`, and compose interpolates it whichever files are
# layered on top. `make stack-local` sets them for you, which is the shorter
# way to say all of the above.
#
# Either way, this assumes the component repos are already checked out:
# raildash is this directory; railmon defaults to the sibling
# checkout ../railmon (override with RAILMON_SRC). The Makefile's
# railmon-src-check verifies that checkout exists and honours the demo env
# vars this stack depends on (datrail/railmon#9) before anything builds.
services:
  raildash:
    image: raildash:local
    build: .
  railmon:
    image: railmon:local
    build: ${RAILMON_SRC:-../railmon}
